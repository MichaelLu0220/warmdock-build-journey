name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The playground has no dependencies, so there is nothing to install.
      - run: npm test
      # demo:print exits; `npm run demo` starts a long-running server, so it is
      # not part of CI.
      - run: npm run demo:print
